name: Build SoundCloud+ (SCMusicPlus) IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the decrypted SoundCloud IPA file (Google Drive or direct link)"
        default: ""
        required: true
        type: string
      deb_url:
        description: "URL to the SCMusicPlus .deb (leave empty for latest release)"
        default: ""
        required: false
        type: string
      display_name:
        description: "App Name (Optional)"
        default: "SoundCloud+"
        required: true
        type: string
      bundle_id:
        description: "Bundle ID (Optional)"
        default: "com.soundcloud.TouchApp"
        required: true
        type: string
      remove_extensions:
        description: "Remove app extensions (Watch, etc.)"
        default: true
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SoundCloud+ (SCMusicPlus) IPA
    runs-on: macos-15
    env:
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - name: Hide Sensitive Inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: bundle_id,display_name,remove_extensions,deb_url

      - name: Download and Validate IPA
        run: |
          python3 -m pip install --break-system-packages gdown
          URL="${{ inputs.ipa_url }}"
          ID=$(echo "$URL" | sed -n 's/.*\/file\/d\/\([^\/]*\).*/\1/p')
          [ -z "$ID" ] && ID=$(echo "$URL" | sed -n 's/.*[?&]id=\([^&]*\).*/\1/p')
          if [ -n "$ID" ]; then
            gdown "$ID" -O soundcloud.ipa
          else
            wget "$URL" --quiet --no-verbose -O soundcloud.ipa
          fi
          case "$(file --mime-type -b soundcloud.ipa)" in application/zip|application/x-ios-app) ;; *) echo "::error::Not an IPA"; exit 1 ;; esac

      - name: Get SoundCloud Version
        run: |
          unzip -q soundcloud.ipa -d scextracted
          APP_PATH=$(find scextracted/Payload -name "*.app" -maxdepth 2 | head -1)
          echo "SC_VERSION=$(grep -A 1 '<key>CFBundleShortVersionString</key>' "$APP_PATH/Info.plist" | grep '<string>' | awk -F'[><]' '{print $3}')" >> $GITHUB_ENV
          rm -rf scextracted

      - name: Download SCMusicPlus Tweak
        run: |
          URL="${{ inputs.deb_url }}"
          if [ -z "$URL" ]; then
            URL=$(curl -s https://api.github.com/repos/qnblackcat/SCMusicPlus/releases/latest \
              | grep "browser_download_url.*\.deb" | cut -d '"' -f 4)
            if [ -z "$URL" ]; then
              echo "::error::No .deb found in SCMusicPlus latest release and no deb_url provided"
              exit 1
            fi
          fi
          ID=$(echo "$URL" | sed -n 's/.*\/file\/d\/\([^\/]*\).*/\1/p')
          [ -z "$ID" ] && ID=$(echo "$URL" | sed -n 's/.*[?&]id=\([^&]*\).*/\1/p')
          if [ -n "$ID" ]; then
            gdown "$ID" -O scmusicplus.deb
          else
            wget "$URL" --quiet --no-verbose -O scmusicplus.deb
          fi
          ls -la scmusicplus.deb

      - name: Strip Broken Signature From Tweak
        run: |
          brew install dpkg
          rm -rf debwork && mkdir -p debwork/root
          dpkg-deb -x scmusicplus.deb debwork/root
          dpkg-deb -e scmusicplus.deb debwork/root/DEBIAN
          DYLIB=$(find debwork/root -name "*.dylib" | head -n 1)
          echo "Found dylib: $DYLIB"
          if [ -z "$DYLIB" ]; then
            echo "::error::No dylib found inside the deb!"
            find debwork/root -type f
            exit 1
          fi
          codesign --remove-signature "$DYLIB" 2>/dev/null || true
          codesign --force --sign - "$DYLIB"
          codesign -dv "$DYLIB" 2>&1 | head -n 5
          dpkg-deb -b debwork/root scmusicplus_fixed.deb
          mv scmusicplus_fixed.deb scmusicplus.deb
          rm -rf debwork

      - name: Install cyan and tbd
        run: |
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          wget --quiet --no-verbose "https://github.com/inoahdev/tbd/releases/download/2.2/tbd-mac" -O /usr/local/bin/tbd
          chmod +x /usr/local/bin/tbd

      - name: Inject Tweak Into IPA
        run: |
          if [ "${{ inputs.remove_extensions }}" = "true" ]; then
            cyan -i soundcloud.ipa \
              -o SoundCloudPlus_${{ env.SC_VERSION }}.ipa \
              -uwesf scmusicplus.deb \
              -n "${{ inputs.display_name }}" \
              -b ${{ inputs.bundle_id }}
          else
            cyan -i soundcloud.ipa \
              -o SoundCloudPlus_${{ env.SC_VERSION }}.ipa \
              -sf scmusicplus.deb \
              -n "${{ inputs.display_name }}" \
              -b ${{ inputs.bundle_id }}
          fi

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundCloudPlus_${{ env.SC_VERSION }}
          path: SoundCloudPlus_${{ env.SC_VERSION }}.ipa
          retention-days: 30

      - name: Job Summary - Build Complete
        run: |
          echo -e '### 🛠️ Build SoundCloud+ (SCMusicPlus) IPA Complete!\n' >> $GITHUB_STEP_SUMMARY
          echo -e '📦 **SoundCloud version:** ${{ env.SC_VERSION }}' >> $GITHUB_STEP_SUMMARY
          echo -e '🎵 **Tweak:** SCMusicPlus (rootless)\n' >> $GITHUB_STEP_SUMMARY
          echo -e '⬇️ **Download:** Scroll to the bottom of this page and grab the artifact under **Artifacts**.' >> $GITHUB_STEP_SUMMARY
